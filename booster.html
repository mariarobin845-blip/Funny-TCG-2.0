<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Version 1 – Ouverture de booster</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>📦 Ouverture de booster</h1>
  <p class="sous-titre">5 cartes par booster, la dernière est au minimum super rare. Clique sur une carte pour la retourner.</p>
  <nav>
    <a href="index.html">Accueil</a>
    <a href="collection.html">Collection</a>
    <a href="pity.html">Tirage à pitié</a>
  </nav>

  <button id="ouvrir">Ouvrir un booster</button>
  <button id="tout" class="secondaire">Tout retourner</button>

  <div class="grille" id="booster"></div>

  <div class="panneau">
    <strong>Taux de tirage</strong>
    <table id="taux"></table>
    <div style="margin-top:8px;color:#a9b0dc;font-size:.85rem">
      Variantes : ✨ Shiny 3 % · Full Art 2 %
    </div>
  </div>

  <script src="cards.js"></script>
  <script>
    const zone = document.getElementById("booster");

    function retourner(el, carte) {
      if (el.classList.contains("retournee")) return;
      el.classList.add("retournee");
      if (carte.rarete === "legendaire" || carte.rarete === "mythique") {
        setTimeout(() => flashEcran(RARETES[carte.rarete].couleur), 250);
      }
    }

    function ouvrirBooster() {
      zone.innerHTML = "";
      for (let i = 0; i < 5; i++) {
        const minimum = i === 4 ? "super_rare" : null;
        const carte = tirerCarte(tirerRarete(minimum));
        const el = creerCarteHTML(carte, false, tirerVariante());
        el.addEventListener("click", () => retourner(el, carte));
        el._carte = carte;
        zone.appendChild(el);
      }
    }

    document.getElementById("ouvrir").onclick = ouvrirBooster;
    document.getElementById("tout").onclick = () =>
      zone.querySelectorAll(".carte").forEach((c, i) =>
        setTimeout(() => retourner(c, c._carte), i * 300));

    // Affichage des taux
    document.getElementById("taux").innerHTML = ORDRE.map(r =>
      `<tr><td><span class="pastille" style="background:${RARETES[r].couleur}"></span>${RARETES[r].label} <span style="color:${RARETES[r].couleur}">${etoilesTexte(r)}</span></td>
       <td>${RARETES[r].taux} %</td></tr>`).join("");

    ouvrirBooster();
  </script>
</body>
</html>
